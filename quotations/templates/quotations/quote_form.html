{% load static %}
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Instant Estimate - Ghidora Transport</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* =================================================================
           🎬 WOW 3D ANIMATED BACKGROUND & GLASSMORPHISM CARD STYLES
        ================================================================== */
        @property --angle {
          syntax: '<angle>';
          initial-value: 0deg;
          inherits: false;
        }

        @keyframes borderRotate {
          to { --angle: 360deg; }
        }

        @keyframes btnSheenSweep {
          0% { left: -150%; }
          35%, 100% { left: 150%; }
        }

        @keyframes orbGlowFloat1 {
          0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
          50% { transform: translate(60px, -40px) scale(1.25); opacity: 0.75; }
        }

        @keyframes orbGlowFloat2 {
          0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.35; }
          50% { transform: translate(-50px, 50px) scale(1.3); opacity: 0.7; }
        }

        @keyframes card3DPop {
          0% { opacity: 0; transform: translateY(30px) scale(0.95); }
          100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        body {
          font-family: 'Outfit', 'Segoe UI', sans-serif;
          background-color: #060911;
          color: #ffffff;
          min-height: 100vh;
          position: relative;
          overflow-x: hidden;
        }

        /* 🌌 3D Animated Canvas Background Layer */
        #quoBgCanvas {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          z-index: 1;
          pointer-events: none;
        }

        /* 🎆 Floating Glowing Ambient Orbs */
        .ambient-orb-1 {
          position: fixed;
          top: 8%;
          left: 12%;
          width: 320px;
          height: 320px;
          background: radial-gradient(circle, rgba(0, 242, 254, 0.25), rgba(0, 114, 255, 0.08) 60%, transparent 80%);
          filter: blur(55px);
          border-radius: 50%;
          pointer-events: none;
          z-index: 2;
          animation: orbGlowFloat1 7s infinite ease-in-out;
        }

        .ambient-orb-2 {
          position: fixed;
          bottom: 10%;
          right: 12%;
          width: 380px;
          height: 380px;
          background: radial-gradient(circle, rgba(255, 0, 127, 0.2), rgba(121, 40, 202, 0.1) 60%, transparent 80%);
          filter: blur(65px);
          border-radius: 50%;
          pointer-events: none;
          z-index: 2;
          animation: orbGlowFloat2 8s infinite ease-in-out;
        }

        /* Main Page Layout Wrapper */
        .quo-page-wrapper {
          position: relative;
          z-index: 10;
          padding: 30px 20px 60px;
          max-width: 850px;
          margin: 0 auto;
        }

        /* 💎 Top Header Bar & 3D Back Button */
        .quo-top-bar {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 25px;
        }

        .btn-back-home-3d {
          position: relative;
          background: linear-gradient(135deg, #0ea5e9, #0284c7, #1d4ed8);
          color: #ffffff !important;
          border: 1px solid rgba(56, 189, 248, 0.7);
          border-bottom: 4px solid #0369a1;
          border-radius: 14px;
          padding: 11px 22px;
          font-size: 13px;
          font-weight: 800;
          letter-spacing: 0.6px;
          cursor: pointer;
          display: inline-flex;
          align-items: center;
          gap: 10px;
          text-transform: uppercase;
          text-decoration: none;
          box-shadow: 0 8px 24px rgba(14, 165, 233, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.35);
          transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
          overflow: hidden;
          z-index: 1;
        }

        .btn-back-home-3d::before {
          content: '';
          position: absolute;
          top: 0; left: -150%;
          width: 80%; height: 100%;
          background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
          transform: skewX(-25deg);
          animation: btnSheenSweep 3.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-back-home-3d:hover {
          transform: translateY(-4px) scale(1.03);
          border-bottom-width: 5px;
          box-shadow: 0 14px 30px rgba(56, 189, 248, 0.6), 0 0 20px rgba(0, 242, 254, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.6);
          color: #ffffff;
        }

        .btn-back-home-3d:active {
          transform: translateY(2px) scale(0.98);
          border-bottom-width: 1.5px;
          box-shadow: 0 3px 12px rgba(56, 189, 248, 0.5);
        }

        .btn-back-home-3d svg {
          filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.4));
          transition: transform 0.3s ease;
        }

        .btn-back-home-3d:hover svg {
          transform: translateX(-5px) scale(1.2);
        }

        .brand-badge-3d {
          font-family: 'Orbitron', sans-serif;
          font-weight: 900;
          font-size: 13px;
          letter-spacing: 1px;
          color: #00f2fe;
          background: rgba(0, 242, 254, 0.1);
          border: 1px solid rgba(0, 242, 254, 0.3);
          padding: 6px 14px;
          border-radius: 20px;
          box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        /* 👑 Main Page Header Title */
        .quo-title-3d {
          text-align: center;
          font-family: 'Orbitron', sans-serif;
          font-weight: 900;
          font-size: 28px;
          letter-spacing: 1.2px;
          background: linear-gradient(135deg, #ffffff 20%, #00f2fe 60%, #ff007f 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          text-shadow: 0 0 30px rgba(0, 242, 254, 0.5);
          margin-bottom: 6px;
        }

        .quo-subtitle-3d {
          text-align: center;
          color: #94a3b8;
          font-size: 14px;
          font-weight: 600;
          margin-bottom: 30px;
        }

        /* 🌟 3D ROTATING CONIC BORDER CARD WRAPPER */
        .quo-card-3d-wrap {
          position: relative;
          padding: 3px;
          border-radius: 26px;
          background: conic-gradient(from var(--angle), #00f2fe, #7928ca, #ff007f, #00f2fe);
          animation: borderRotate 6s linear infinite, card3DPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
          box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 242, 254, 0.25);
        }

        .quo-card-3d-inner {
          background: linear-gradient(135deg, rgba(11, 17, 30, 0.96), rgba(20, 29, 47, 0.98));
          backdrop-filter: blur(25px);
          -webkit-backdrop-filter: blur(25px);
          border-radius: 23px;
          padding: 38px 34px;
          position: relative;
          z-index: 2;
        }

        /* Form Inputs & Fields */
        .quo-card-3d-inner p {
          margin-bottom: 20px;
        }

        .quo-card-3d-inner label {
          display: block;
          font-weight: 800;
          font-size: 12.5px;
          color: #38bdf8;
          margin-bottom: 7px;
          text-transform: uppercase;
          letter-spacing: 0.6px;
        }

        .quo-card-3d-inner input[type="text"],
        .quo-card-3d-inner input[type="tel"],
        .quo-card-3d-inner input[type="email"],
        .quo-card-3d-inner input[type="number"],
        .quo-card-3d-inner select,
        .quo-card-3d-inner textarea {
          width: 100%;
          padding: 14px 18px;
          border-radius: 14px;
          border: 1.5px solid rgba(255, 255, 255, 0.16);
          background: rgba(15, 23, 42, 0.85);
          color: #ffffff !important;
          font-size: 14.5px;
          font-weight: 600;
          font-family: inherit;
          transition: all 0.25s ease;
          box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .quo-card-3d-inner input:focus,
        .quo-card-3d-inner select:focus,
        .quo-card-3d-inner textarea:focus {
          border-color: #00f2fe;
          background: rgba(15, 23, 42, 0.98);
          outline: none;
          box-shadow: 0 0 22px rgba(0, 242, 254, 0.5), inset 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        /* 🚀 ULTRA 3D SUBMIT BUTTON */
        .btn-submit-3d {
          width: 100%;
          padding: 15px 30px;
          background: linear-gradient(135deg, #00f2fe, #10b981, #059669);
          border: 1px solid rgba(52, 211, 153, 0.8);
          border-bottom: 4.5px solid #047857;
          border-radius: 16px;
          color: #0f172a;
          font-weight: 900;
          font-size: 15.5px;
          letter-spacing: 0.8px;
          text-transform: uppercase;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 12px;
          box-shadow: 0 10px 28px rgba(0, 242, 254, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.4);
          transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
          position: relative;
          overflow: hidden;
          margin-top: 10px;
        }

        .btn-submit-3d::before {
          content: '';
          position: absolute;
          top: 0; left: -150%;
          width: 80%; height: 100%;
          background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
          transform: skewX(-25deg);
          animation: btnSheenSweep 3.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-submit-3d:hover {
          transform: translateY(-4px) scale(1.02);
          border-bottom-width: 5.5px;
          box-shadow: 0 16px 36px rgba(0, 242, 254, 0.65), 0 0 25px rgba(52, 211, 153, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.7);
          color: #000000;
        }

        .btn-submit-3d:active {
          transform: translateY(2px) scale(0.98);
          border-bottom-width: 1.5px;
          box-shadow: 0 4px 14px rgba(0, 242, 254, 0.5);
        }

        .btn-submit-3d svg {
          filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
          transition: transform 0.3s ease;
        }

        .btn-submit-3d:hover svg {
          transform: scale(1.25) rotate(10deg);
        }
    </style>
</head>
<body>

<!-- 🌌 3D Interactive Canvas Particle Background -->
<canvas id="quoBgCanvas"></canvas>

<!-- 🎆 Ambient Glow Orbs -->
<div class="ambient-orb-1"></div>
<div class="ambient-orb-2"></div>

<div class="quo-page-wrapper">
    <!-- 💎 Top Header Bar with 3D Back to Home Button -->
    <div class="quo-top-bar">
        <a href="{% url 'home' %}" class="btn-back-home-3d">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Back to Home</span>
        </a>
        <div class="brand-badge-3d">GHIDORA TRANSPORT</div>
    </div>

    <h1 class="quo-title-3d">{% if admin_mode %}Custom Quotation Banayein{% else %}Get Instant Price Estimate{% endif %}</h1>
    <p class="quo-subtitle-3d">Bina booking kiye instant estimate paayein — PDF & WhatsApp ready</p>

    <!-- 🌟 3D Rotating Conic Border Card Wrapper -->
    <div class="quo-card-3d-wrap">
        <div class="quo-card-3d-inner">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-submit-3d">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span>{% if admin_mode %}Custom Quote Banayein{% else %}Get Instant Estimate{% endif %}</span>
                </button>
            </form>
        </div>
    </div>
</div>

<!-- 🎬 JavaScript 3D Particle Mesh Background Engine -->
<script>
  (function() {
    const canvas = document.getElementById('quoBgCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = [];
    const count = 45;

    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.8,
        vy: (Math.random() - 0.5) * 0.8,
        radius: Math.random() * 2 + 1,
        color: i % 2 === 0 ? 'rgba(0, 242, 254, ' : 'rgba(255, 0, 127, '
      });
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < count; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color + '0.7)';
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color + '1)';
        ctx.fill();

        for (let j = i + 1; j < count; j++) {
          const p2 = particles[j];
          const dx = p.x - p2.x;
          const dy = p.y - p2.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 130) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = `rgba(0, 242, 254, ${0.15 * (1 - dist / 130)})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  })();
</script>

</body>
</html>
