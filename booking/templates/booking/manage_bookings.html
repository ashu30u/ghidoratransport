<!DOCTYPE html>
<html>

<head>

    <title> 🕮 Booking Management</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{

            background:linear-gradient(
                135deg,
                #0f2027,
                #203a43,
                #2c5364
            );

            min-height:100vh;

            padding:30px;

            color:white;
        }

        h1{

            text-align:center;

            margin-bottom:30px;

            font-size:40px;
        }

        .table-box{

            width:95%;

            margin:auto;

            background:rgba(255,255,255,0.10);

            backdrop-filter:blur(10px);

            border-radius:20px;

            padding:25px;

            box-shadow:0 10px 30px rgba(0,0,0,.3);
        }

        table{

            width:100%;

            border-collapse:collapse;
        }

        th{

            background:#00e5ff;

            color:black;

            padding:15px;
        }

        td{

            padding:12px;

            text-align:center;

            border-bottom:1px solid rgba(255,255,255,.2);
        }

        tr:hover{

            background:rgba(255,255,255,.1);
        }

        .btn{

            background:#00e5ff;

            color:black;

            padding:10px 18px;

            border:none;

            border-radius:8px;

            cursor:pointer;

            font-weight:bold;
        }

        .btn:hover{

            background:#00bcd4;
        }

        select{

            padding:8px;

            border-radius:8px;
        }

        .back{

            display:inline-block;

            margin-bottom:25px;

            text-decoration:none;

            color:white;

            background:#7c4dff;

            padding:12px 22px;

            border-radius:10px;
        }

    </style>

</head>

<body>

<a href="/dashboard/" class="back">
    ← Back To Dashboard
</a>

<h1>
     Booking Management
</h1>

<div class="table-box">

<table>

<tr>

<th>Booking ID</th>

<th>Name</th>

<th>Phone</th>

<th>Vehicle</th>

<th>Fare</th>

<th>Status</th>

<th>Action</th>

</tr>

{% for booking in bookings %}

<tr>

<td>{{ booking.booking_id }}</td>

<td>{{ booking.name }}</td>

<td>{{ booking.phone }}</td>

<td>{{ booking.vehicle_type }}</td>

<td>₹{{ booking.fare }}</td>

<td>

<form method="POST">

    {% csrf_token %}

    <input
        type="hidden"
        name="booking_id"
        value="{{ booking.id }}">

    <select name="status">

<option
{% if booking.status == "Pending" %}
selected
{% endif %}
>
Pending
</option>

<option
{% if booking.status == "Confirmed" %}
selected
{% endif %}
>
Confirmed
</option>

<option
{% if booking.status == "Completed" %}
selected
{% endif %}
>
Completed
</option>

<option
{% if booking.status == "Cancelled" %}
selected
{% endif %}
>
Cancelled
</option>

</select>

</td>

<td>

    <button
        type="submit"
        class="btn">

        Update

    </button>

</form>

<a
    href="/delete-booking/{{ booking.id }}/"
    onclick="return confirm('Are you sure you want to delete this booking?')"
    style="
        background:#ee4545;
        color:white;
        padding:10px 15px;
        border-radius:8px;
        text-decoration:none;
        font-weight:bold;
        margin-left:10px;
    ">

    Delete

</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
