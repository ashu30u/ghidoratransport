<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghidora Transport - Cargo Mission</title>
<style>
  :root{
    --bg:#0e1320; --road:#2b2f3a; --line:#f2c14e; --accent:#ff7b00;
    --panel:#141a2b; --panel2:#1c2338; --text:#eef1f8; --sub:#9aa4c0;
    --good:#2ecc71; --warn:#f39c12; --bad:#e74c3c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:Segoe UI,Arial,sans-serif;overflow:hidden;}
  #wrap{position:relative;width:100%;height:100vh;}
  canvas{display:block;background:#1a2235;}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:10px 14px;pointer-events:none;}
  .card{background:rgba(20,26,43,.85);border:1px solid #2a3350;border-radius:10px;
    padding:8px 12px;backdrop-filter:blur(3px);}
  #mission{min-width:220px;}
  #mission h3{margin:0 0 4px;font-size:13px;color:var(--accent);}
  #mission div{font-size:12px;color:var(--sub);}
  #stats{text-align:right;min-width:160px;}
  .bar{width:140px;height:10px;background:#222a42;border-radius:6px;overflow:hidden;margin:4px 0;}
  .bar>span{display:block;height:100%;}
  #fuelBar>span{background:var(--good);}
  #cargoBar>span{background:var(--accent);}
  #bottom{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-end;padding:14px;pointer-events:none;}
  #scorebox{font-size:13px;}
  #scorebox b{color:var(--line);}
  #msgCenter{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);
    text-align:center;background:var(--panel);border:1px solid #2a3350;border-radius:14px;
    padding:24px 28px;display:none;min-width:280px;}
  #msgCenter h2{margin:0 0 8px;color:var(--accent);}
  #msgCenter p{color:var(--sub);font-size:13px;margin:4px 0 14px;}
  button{background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:10px 18px;font-weight:bold;cursor:pointer;font-size:14px;}
  button:hover{background:#ff9633;}
  #touchpad{position:absolute;bottom:14px;right:14px;display:none;grid-template-columns:repeat(3,54px);
    grid-template-rows:repeat(2,54px);gap:6px;pointer-events:auto;}
  #touchpad button{opacity:.85;font-size:20px;padding:0;}
  @media (pointer:coarse){ #touchpad{display:grid;} }
  #logo{font-size:13px;letter-spacing:1px;color:var(--sub);}
  #logo b{color:var(--line);}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="mission" class="card">
      <h3 id="logo">🚚 GHIDORA <b>TRANSPORT</b></h3>
      <div id="missionText">Loading mission...</div>
    </div>
    <div id="stats" class="card">
      <div>⛽ Fuel</div><div class="bar" id="fuelBar"><span style="width:100%"></span></div>
      <div>📦 Cargo Condition</div><div class="bar" id="cargoBar"><span style="width:100%"></span></div>
    </div>
  </div>
  <div id="bottom">
    <div id="scorebox" class="card">
      Level <b id="lvl">1</b> &nbsp;|&nbsp; Coins <b id="coins">0</b> &nbsp;|&nbsp; XP <b id="xp">0</b>
    </div>
    <div id="touchpad">
      <span></span><button id="btnUp">▲</button><span></span>
      <button id="btnLeft">◀</button><button id="btnDown">▼</button><button id="btnRight">▶</button>
    </div>
  </div>
  <div id="msgCenter">
    <h2 id="msgTitle">Mission Complete!</h2>
    <p id="msgSub"></p>
    <button id="msgBtn">Next Mission</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resize(){canvas.width = innerWidth; canvas.height = innerHeight;}
resize(); addEventListener('resize', resize);

// ---------- Game State ----------
const keys = {};
addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
['Up','Down','Left','Right'].forEach(dir=>{
  const b = document.getElementById('btn'+dir), k = {Up:'arrowup',Down:'arrowdown',Left:'arrowleft',Right:'arrowright'}[dir];
  b.addEventListener('touchstart', e=>{e.preventDefault(); keys[k]=true;});
  b.addEventListener('touchend', e=>{e.preventDefault(); keys[k]=false;});
});

const CITIES = ['Kodebod','Dhamtari','Kurud','Raipur'];
const CARGO = [
  {name:'Vegetables', mult:1.0}, {name:'General Goods', mult:1.0},
  {name:'Furniture', mult:1.3}, {name:'Electronics', mult:1.6}
];

let level = 1, coins = 0, xp = 0;
let mission = null;
let world = { roadY: 0 };

const player = { x: 0, y: 0, angle: -Math.PI/2, speed: 0, maxSpeed: 4.2, fuel: 100, cargoCond: 100 };
let destMarker = { x: 600, y: -400 };
let obstacles = [];
let particles = [];
let running = false;
let elapsed = 0;
let timeLimit = 60;

function rand(a,b){return a + Math.random()*(b-a);}

function newMission(){
  const from = CITIES[Math.floor(rand(0,CITIES.length))];
  let to = CITIES[Math.floor(rand(0,CITIES.length))];
  while(to===from) to = CITIES[Math.floor(rand(0,CITIES.length))];
  const cargo = CARGO[Math.floor(rand(0,CARGO.length))];
  const weight = Math.round(rand(300,1200));
  const dist = rand(900,1500);
  const reward = Math.round((weight/10) * cargo.mult + rand(100,300));
  mission = {from,to,cargo:cargo.name,weight,dist,reward,cargoMult:cargo.mult};
  timeLimit = Math.max(40, 90 - level*2);
  elapsed = 0;
  player.x = 0; player.y = 0; player.angle = -Math.PI/2; player.speed = 0;
  player.fuel = 100; player.cargoCond = 100;
  destMarker = {x: rand(-200,200), y: -dist};
  obstacles = [];
  for(let i=0;i<10+level;i++){
    obstacles.push({x: rand(-220,220), y: -rand(100,dist-100), r: 16});
  }
  document.getElementById('missionText').innerHTML =
    `<b>${from} → ${to}</b><br>📦 ${cargo.name} (${weight}kg)<br>💰 ₹${reward} | ⏱ ${timeLimit}s`;
  document.getElementById('msgCenter').style.display='none';
  running = true;
}

function endMission(success){
  running = false;
  const box = document.getElementById('msgCenter');
  const title = document.getElementById('msgTitle');
  const sub = document.getElementById('msgSub');
  if(success){
    const condFactor = player.cargoCond/100;
    const earned = Math.round(mission.reward * condFactor);
    coins += earned; xp += 50 + level*5;
    if(xp >= level*200){ level++; }
    title.textContent = '✅ Delivery Complete!';
    sub.textContent = `Cargo condition: ${Math.round(player.cargoCond)}% — Earned ₹${earned} + XP`;
  } else {
    title.textContent = '❌ Mission Failed';
    sub.textContent = player.fuel<=0 ? 'Out of fuel.' : 'Time ran out.';
  }
  document.getElementById('coins').textContent = coins;
  document.getElementById('xp').textContent = xp;
  document.getElementById('lvl').textContent = level;
  box.style.display = 'block';
}

document.getElementById('msgBtn').addEventListener('click', newMission);

function update(dt){
  if(!running) return;
  elapsed += dt;
  if(elapsed > timeLimit){ endMission(false); return; }
  if(player.fuel <= 0){ endMission(false); return; }

  const accel = (keys['arrowup']||keys['w']) ? 0.08 : (keys['arrowdown']||keys['s']) ? -0.08 : -0.03;
  player.speed = Math.max(0, Math.min(player.maxSpeed, player.speed + accel));
  if(keys['arrowdown']||keys['s']) player.speed = Math.max(0, player.speed - 0.1);
  const turn = (keys['arrowleft']||keys['a']) ? -0.045 : (keys['arrowright']||keys['d']) ? 0.045 : 0;
  if(player.speed > 0.2) player.angle += turn * (player.speed/player.maxSpeed);

  player.x += Math.cos(player.angle) * player.speed;
  player.y += Math.sin(player.angle) * player.speed;

  const weightFactor = mission.weight/1200;
  player.fuel -= (0.025 + player.speed*0.01 + weightFactor*0.015);

  // collisions
  obstacles.forEach(o=>{
    const d = Math.hypot(player.x-o.x, player.y-o.y);
    if(d < o.r+14){
      player.cargoCond -= 0.6;
      player.speed *= 0.9;
      particles.push({x:player.x,y:player.y,life:20});
    }
  });
  player.cargoCond = Math.max(0, player.cargoCond);

  // reached destination
  if(Math.hypot(player.x-destMarker.x, player.y-destMarker.y) < 40){
    endMission(true);
  }

  document.getElementById('fuelBar').firstElementChild.style.width = Math.max(0,player.fuel)+'%';
  document.getElementById('fuelBar').firstElementChild.style.background =
    player.fuel<25 ? 'var(--bad)' : player.fuel<55 ? 'var(--warn)' : 'var(--good)';
  document.getElementById('cargoBar').firstElementChild.style.width = player.cargoCond+'%';
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const camX = canvas.width/2 - player.x;
  const camY = canvas.height/2 - player.y;

  // road
  ctx.save();
  ctx.translate(camX, camY);
  ctx.fillStyle = '#2b2f3a';
  ctx.fillRect(-300, -3000, 600, 6000);
  ctx.strokeStyle = '#f2c14e';
  ctx.setLineDash([24,20]);
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0,-3000); ctx.lineTo(0,3000); ctx.stroke();
  ctx.setLineDash([]);

  // destination
  ctx.fillStyle = '#2ecc71';
  ctx.beginPath(); ctx.arc(destMarker.x, destMarker.y, 22, 0, 7); ctx.fill();
  ctx.fillStyle = '#0e1320'; ctx.font='bold 11px Arial'; ctx.textAlign='center';
  ctx.fillText('DROP', destMarker.x, destMarker.y+4);

  // obstacles
  obstacles.forEach(o=>{
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,7); ctx.fill();
  });

  // particles
  particles.forEach(p=>{
    ctx.fillStyle = `rgba(255,123,0,${p.life/20})`;
    ctx.beginPath(); ctx.arc(p.x+rand(-10,10),p.y+rand(-10,10),4,0,7); ctx.fill();
    p.life--;
  });
  particles = particles.filter(p=>p.life>0);

  // player truck
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle + Math.PI/2);
  ctx.fillStyle = '#ff7b00';
  ctx.fillRect(-12,-20,24,40);
  ctx.fillStyle = '#1c2338';
  ctx.fillRect(-10,-18,20,14);
  ctx.restore();

  ctx.restore();

  // minimap
  const mw=120, mh=180, mx=canvas.width-mw-14, my=70;
  ctx.fillStyle='rgba(20,26,43,.85)'; ctx.fillRect(mx,my,mw,mh);
  ctx.strokeStyle='#2a3350'; ctx.strokeRect(mx,my,mw,mh);
  const scale = mh/1600;
  const px = mx+mw/2, py = my+mh/2 + player.y*scale;
  ctx.fillStyle='#ff7b00'; ctx.beginPath(); ctx.arc(px,Math.max(my+4,Math.min(my+mh-4,py)),4,0,7); ctx.fill();
  const dx = mx+mw/2 + destMarker.x*scale*0.3, dy = my+mh/2 + destMarker.y*scale;
  ctx.fillStyle='#2ecc71'; ctx.beginPath(); ctx.arc(dx,Math.max(my+4,Math.min(my+mh-4,dy)),4,0,7); ctx.fill();
}

let last = performance.now();
function loop(now){
  const dt = (now-last)/1000; last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
newMission();
requestAnimationFrame(loop);
</script>
</body>
</html>
