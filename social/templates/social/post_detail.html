{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<!-- Tabler Icons CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="{% static 'social/css/social.css' %}">
{% endblock %}

{% block content %}
<div class="ig-feed-container">
  <div style="margin-bottom: 12px;">
    <a href="{% url 'social:feed' %}" class="ig-page-btn">
      <i class="ti ti-arrow-left"></i> Back to Feed
    </a>
  </div>

  {% include "social/post_card.html" %}

</div>

<!-- Who Liked Modal -->
<div class="ig-modal" id="likesModal" style="display:none;">
  <div class="ig-modal-backdrop" onclick="closeLikesModal()"></div>
  <div class="ig-modal-box">
    <div class="ig-modal-header">
      <h3>Likes</h3>
      <button class="ig-modal-close" onclick="closeLikesModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="ig-modal-body ig-likes-modal-body" id="likesListContainer">
      <div class="ig-loading">Loading...</div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'social/js/social.js' %}"></script>
{% endblock %}
