<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ghidora Transport — Logout</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-0:#04060b;
    --bg-1:#070b16;
    --bg-2:#0c1324;
    --blue:#3fa4ff;
    --cyan:#1fe6c8;
    --amber:#ff9142;
    --text-hi:#eef3fb;
    --text-mid:#aab7cf;
    --glass-fill: rgba(14,22,40,0.88);
    --glass-border: rgba(130,185,255,0.28);
    --danger:#ff5f6d;
    --radius-card: 22px;
    --radius-field: 12px;
    --ff-display:'Space Grotesk', sans-serif;
    --ff-body:'Inter', sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:var(--bg-0);
    color:var(--text-hi);
    font-family:var(--ff-body);
    overflow-x:hidden;
  }

  .scene-grade{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(120% 90% at 18% 30%, rgba(63,164,255,0.15), transparent 60%),
      radial-gradient(90% 70% at 78% 70%, rgba(31,230,200,0.1), transparent 55%),
      radial-gradient(150% 120% at 50% 100%, rgba(0,0,0,0.85), transparent 45%);
  }

  .card-stage{
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    padding:40px 20px;
    position: relative; z-index: 5;
  }

  .logout-card{
    width:min(420px, 100%);
    padding:40px 34px;
    border-radius:var(--radius-card);
    background:var(--glass-fill);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(22px);
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.85);
    text-align: center;
  }

  .logout-title{ font-family:var(--ff-display); font-weight:700; font-size:26px; margin-bottom: 12px; }
  .logout-sub{ color: var(--text-mid); font-size: 14.5px; margin-bottom: 28px; line-height: 1.5; }

  .btn-group{ display: flex; gap: 12px; }

  .btn{
    flex: 1; border:none; border-radius:var(--radius-field);
    font-family:var(--ff-body); font-weight:700; font-size:14.5px;
    padding:14px 18px; cursor:pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.25s ease;
  }

  .btn-danger{
    background:linear-gradient(135deg, #ef4444, #dc2626);
    color:#ffffff;
    box-shadow:0 10px 24px rgba(239, 68, 68, 0.4);
  }
  .btn-danger:hover{ transform: translateY(-2px); }

  .btn-cancel{
    background:rgba(255,255,255,0.08);
    border:1.5px solid rgba(255,255,255,0.2);
    color:var(--text-hi);
  }
  .btn-cancel:hover{ background:rgba(255,255,255,0.15); transform: translateY(-2px); }
</style>
</head>
<body>

<div class="scene-grade"></div>

<main class="card-stage">
  <div class="logout-card">
    <div style="font-size: 44px; margin-bottom: 14px;">🚪</div>
    <h1 class="logout-title">Sign Out</h1>
    <p class="logout-sub">Are you sure you want to sign out of your <strong>Ghidora Transport</strong> account?</p>

    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      <div class="btn-group">
        <a href="/" class="btn btn-cancel">Cancel</a>
        <button type="submit" class="btn btn-danger">Yes, Logout</button>
      </div>
    </form>
  </div>
</main>

</body>
</html>
