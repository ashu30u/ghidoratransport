<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ghidora Transport — Email Sent</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-0:#04060b;
    --bg-1:#070b16;
    --bg-2:#0c1324;
    --blue:#3fa4ff;
    --blue-soft:#7cc4ff;
    --cyan:#1fe6c8;
    --amber:#ff9142;
    --amber-soft:#ffb578;
    --text-hi:#eef3fb;
    --text-mid:#aab7cf;
    --text-lo:#647192;
    --glass-fill: rgba(14,22,40,0.85);
    --glass-border: rgba(130,185,255,0.28);
    --glass-border-hi: rgba(160,205,255,0.55);
    --radius-card: 22px;
    --radius-field: 12px;
    --ff-display:'Space Grotesk', sans-serif;
    --ff-body:'Inter', sans-serif;
    --ff-mono:'JetBrains Mono', monospace;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:var(--bg-0);
    color:var(--text-hi);
    font-family:var(--ff-body);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  body{ position:relative; min-height: 100vh; }

  .scene-grade{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(120% 90% at 18% 30%, rgba(63,164,255,0.15), transparent 60%),
      radial-gradient(90% 70% at 78% 70%, rgba(31,230,200,0.1), transparent 55%),
      radial-gradient(150% 120% at 50% 100%, rgba(0,0,0,0.85), transparent 45%);
  }

  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    padding:20px clamp(20px,4vw,56px);
  }

  .logo{
    display:flex; align-items:center; gap:11px;
    font-family:var(--ff-display); font-weight:700; font-size:20px; color: #fff; text-decoration: none;
  }
  .logo-mark{
    width:36px; height:36px; border-radius:10px;
    background:conic-gradient(from 220deg, var(--blue), var(--cyan), var(--amber), var(--blue));
    position:relative; box-shadow:0 0 22px rgba(63,164,255,0.55);
  }
  .logo-mark::before{ content:''; position:absolute; inset:5px; background:var(--bg-0); border-radius:6px; }
  .logo-text small{ display:block; font-family:var(--ff-mono); font-weight:400; font-size:9.5px; letter-spacing:0.22em; color:var(--text-lo); text-transform:uppercase; margin-top:1px; }

  .card-stage{
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    padding:80px 20px 40px;
    position: relative; z-index: 5;
  }

  .done-card{
    width:min(440px, 100%);
    padding:38px 34px 30px;
    border-radius:var(--radius-card);
    background:var(--glass-fill);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.85);
    text-align: center;
  }

  .done-icon{
    font-size: 48px; margin-bottom: 16px; display: inline-block;
  }
  .card-eyebrow{ font-family:var(--ff-mono); font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--cyan); margin-bottom:8px; }
  .card-title{ font-family:var(--ff-display); font-weight:700; font-size:28px; margin-bottom: 12px; }
  .card-title .accent{ color:var(--cyan); }
  .card-desc{ color:var(--text-mid); font-size:14.5px; line-height:1.6; margin-bottom:28px; }

  .btn{
    width:100%; border:none; border-radius:var(--radius-field);
    font-family:var(--ff-body); font-weight:700; font-size:15px;
    padding:14px 18px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
    transition: all 0.25s ease; text-decoration:none;
    background:linear-gradient(135deg, var(--blue) 0%, #2c7ff0 55%, var(--amber) 130%);
    color:#04060b;
    box-shadow:0 12px 28px -10px rgba(63,164,255,0.6);
  }
  .btn:hover{ transform: translateY(-2px); box-shadow:0 14px 34px -8px rgba(63,164,255,0.8); }
</style>
</head>
<body>

<div class="scene-grade" aria-hidden="true"></div>

<header class="topbar">
  <a href="/" class="logo">
    <div class="logo-mark"></div>
    <div class="logo-text">GHIDORA <small>TRANSPORT</small></div>
  </a>
  <a href="/" style="color: var(--cyan); text-decoration: none; font-size: 13px; font-weight: 700;">🏠 Back to Home</a>
</header>

<main class="card-stage">
  <div class="done-card">
    <div class="done-icon">📩</div>
    <div class="card-eyebrow">CHECK YOUR INBOX</div>
    <h2 class="card-title">Reset Email <span class="accent">Sent</span></h2>
    <p class="card-desc">We have sent a password reset link to your email address. Please check your inbox (and spam folder) to reset your password.</p>

    <a href="{% url 'account_login' %}" class="btn">
      🔑 Back to Sign In
    </a>
  </div>
</main>

</body>
</html>
